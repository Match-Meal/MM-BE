spring.application.name=matchmeal\

# datasource
#spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
spring.datasource.url=jdbc:mysql://matchmeal-project.chmge8kcwil3.ap-northeast-2.rds.amazonaws.com/mm_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
#h2
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
# h2 db 데이터 초기화
# spring.sql.init.mode=always
# 실제 MySQL 운영 환경에선 데이터 초기화를 막기 위해 never로 설정
# spring.sql.init.mode=never
# spring.sql.init.schema-locations=classpath:schema.sql
# spring.sql.init.encoding=UTF-8
#mybatis
mybatis.mapper-locations=classpath*:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.pagoda.matchmeal.model.entity
logging.level.com.pagoda.matchmeal.mapper=DEBUG
## 테스트용
# 배치 작업 수동 run ( 실 서버에서는 true )
spring.batch.job.enabled=false
# Spring Batch가 사용하는 메타 테이블(BATCH_JOB_...)을 H2에 자동 생성
spring.batch.jdbc.initialize-schema=always
# google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
# OAuth2 - Kakao
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
# [중요] 카카오 연결 해제용 Admin Key
spring.security.oauth2.client.registration.kakao.admin-key=${KAKAO_ADMIN_KEY}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image
spring.security.oauth2.client.registration.kakao.client-name=Kakao

# OAuth2 Provider - Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# jwt
jwt.secret=${JWT_SECRET_KEY}
# aws
cloud.aws.s3.bucket=matchmeal-bucket
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=ap-northeast-2
cloud.aws.stack.auto=false
# file용량
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
logging.level.com.amazonaws.util.EC2MetadataUtils=error
cors.url=http://localhost:5173

spring.data.redis.host=localhost
spring.data.redis.port=6379

ai.url=http://127.0.0.1:8000/vision/analyze

kakaopay.admin-key=${KAKAOPAY_SECRET_KEY}
springdoc.api-docs.enabled=true
springdoc.show-actuator=true
springdoc.override-with-generic-response=true
