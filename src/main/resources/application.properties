spring.application.name=matchmeal\

# datasource
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
#h2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
#mybatis
mybatis.mapper-locations=classpath*:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.pagoda.matchmeal.model.entity
logging.level.com.pagoda.matchmeal.mapper=DEBUG
# h2 db 데이터 초기화
spring.sql.init.mode=always
# 실제 MySQL 운영 환경에선 데이터 초기화를 막기 위해 never로 설정
# spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8
## 테스트용
# 배치 작업 수동 run ( 실 서버에서는 true )
spring.batch.job.enabled=false
# Spring Batch가 사용하는 메타 테이블(BATCH_JOB_...)을 H2에 자동 생성
spring.batch.jdbc.initialize-schema=always
# googl
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
# jwt
jwt.secret=${JWT_SECRET_KEY}